<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Barrancas Vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui;background:#0f1113;color:#eee}#map{height:100vh}.badge{position:absolute;top:10px;left:50px;z-index:1000;background:#111;padding:8px 12px;border-radius:8px}</style>
</head><body><div class=badge id=info>Cargando 38-46 + VL176...</div><div id=map></div>
<script>
const map=L.map('map').setView([-32.896,-68.842],13);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
let markers={};
async function load(){
 try{
  const r=await fetch('/api/vehicles'); const data=await r.json();
  if(data.error) throw new Error(data.error);
  document.getElementById('info').textContent=`${data.count_filtrado||data.count||0} camiones - ${new Date().toLocaleTimeString()}`;
  (data.vehicles||[]).forEach(v=>{
   const key=v.id||v.patente;
   const html=`<b>Camión ${v.alias||v.patente}</b><br>Pat:${v.patente}<br>Chofer:${v.chofer}<br>Vel:${v.velocidad}km/h<br>${v.estado}<br>${v.ultima||''}`;
   if(markers[key]) markers[key].setLatLng([v.lat,v.lng]).setPopupContent(html);
   else markers[key]=L.marker([v.lat,v.lng]).addTo(map).bindPopup(html);
  });
 }catch(e){ document.getElementById('info').textContent='Error: '+e.message+' - Renová CYBID en Render'; console.error(e); }
}
load(); setInterval(load,20000);
</script></body></html>
